services:
  bot:
    build: .
    container_name: local-agent-bot

    # Секреты приходят на рантайме, а не из образа (.env исключён .dockerignore).
    # llm_client читает OPENROUTER_* лениво из os.environ при каждом вызове,
    # поэтому файла .env внутри контейнера не требуется.
    env_file: .env

    restart: unless-stopped

    # Обязательно: процесс порождает Node-подпроцесс (MCP-сервер), и без
    # init-процесса в роли PID 1 зомби-процессы не пожинаются.
    init: true

    # Дать long polling закрыться штатно.
    stop_grace_period: 20s

    volumes:
      # Память по каждому Telegram-пользователю.
      - ./data:/app/data
      # Песочница MCP-сервера и каталог вывода PDF.
      - ./workspace:/app/workspace
      # Корпус + готовые index.npz и chunks.json: сохраняют mtime исходника,
      # поэтому платный пере-эмбеддинг базы знаний не запускается.
      - ./knowledge:/app/knowledge
      #
      # Альтернатива для разработки — смонтировать проект целиком вместо трёх
      # строк выше. Правки кода подхватываются без пересборки, а agent.log
      # оказывается на хосте (иначе он читается через
      # `docker compose exec bot cat agent.log`):
      # - .:/app
